# Perfil "ssl": el Gateway solo atiende HTTPS (TLS 1.2/1.3) en el puerto 8443.
# Se activa con SPRING_PROFILES_ACTIVE=ssl (asi esta en docker-compose.yaml).
server:
  port: 8443
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE:file:/app/certs/gateway.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: gateway
    enabled-protocols: TLSv1.3,TLSv1.2

# Actuator en un puerto interno sin TLS (healthchecks de Docker / Load Balancer de AWS)
management:
  server:
    port: 9080
    ssl:
      enabled: false

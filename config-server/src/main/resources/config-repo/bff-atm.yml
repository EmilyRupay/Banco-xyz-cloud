# BFF CAJEROS: terminales autorizados y limites de retiro
server:
  port: 8086

bank:
  atm:
    terminales: ATM-001,ATM-002,ATM-003
    monto-minimo: 5000
    monto-maximo: 200000
    multiplo: 5000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          - org.springframework.web.server.ResponseStatusException
    instances:
      accounts:
        base-config: default
      payments:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 2
        wait-duration: 300ms
        # Si el circuito esta abierto no tiene sentido reintentar
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - org.springframework.web.server.ResponseStatusException
    instances:
      accounts:
        base-config: default
      payments:
        base-config: default
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 10
        max-wait-duration: 0
    instances:
      accounts:
        base-config: default
      payments:
        base-config: default

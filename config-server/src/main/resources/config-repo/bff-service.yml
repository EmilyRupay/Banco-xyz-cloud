server:
  port: 8084

# ------------------------------------------------------------
# Resilience4j: una instancia por cada servicio remoto que consume el BFF
# ------------------------------------------------------------
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      accounts:
        base-config: default
      transactions:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        # Si el circuito esta abierto no tiene sentido reintentar
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
    instances:
      accounts:
        base-config: default
      transactions:
        base-config: default
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 10
        max-wait-duration: 0
    instances:
      accounts:
        base-config: default
      transactions:
        base-config: default

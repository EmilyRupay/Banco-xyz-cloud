server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    # Evita el modo "self-preservation" ruidoso en entornos de desarrollo
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
